# 全栈部署（08 §10 / B6b 加固版）：postgres(pgvector) / redis / api / worker / beat /
# frontend(nginx) / prometheus / grafana / backup
# 用法：先在 backend/.env 设置 POSTGRES_PASSWORD / REDIS_PASSWORD / JWT_SECRET / METRICS_TOKEN，
# 然后 docker compose up -d --build
name: ai-customer-service

x-service-defaults: &service-defaults
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - appnet

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-cs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ai_customer_service
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    <<: *service-defaults
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-cs-redis
    # 生产强制 requirepass + AOF 持久化 + 内存上限（防无限增长）
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 512m
    <<: *service-defaults
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: ai-cs-api
    env_file: .env
    environment:
      # docker 内使用服务名；凭据从 .env 注入，禁止默认口令
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/ai_customer_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JSON_LOGS: "true"
      TASK_BACKEND: celery
      STORAGE_DIR: /app/storage
    # --proxy-headers：正确解析 nginx 转发头；仅信任 appnet 子网，防 X-Forwarded-For 伪造
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.28.0.0/16
    ports:
      - "127.0.0.1:8001:8000"  # 仅本机可直连调试（8000 常被其他本地服务占用）；公网流量走 frontend nginx
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    <<: *service-defaults
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    container_name: ai-cs-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/ai_customer_service
      ENVIRONMENT: ${ENVIRONMENT:-production}
    # 迁移后引导初始管理员（生产需在 .env 设置 ADMIN_INITIAL_PASSWORD）
    command: sh -c "alembic upgrade head && python -m app.cli bootstrap"
    mem_limit: 512m
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    container_name: ai-cs-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/ai_customer_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JSON_LOGS: "true"
      TASK_BACKEND: celery
      STORAGE_DIR: /app/storage
    command: celery -A app.workers.tasks:celery_app worker -l info
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    <<: *service-defaults
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.tasks:celery_app", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  beat:
    build: .
    container_name: ai-cs-beat
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/ai_customer_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TASK_BACKEND: celery
    # 定时调度：每日清理过期 trace_logs（maintenance.prune_trace_logs）
    command: celery -A app.workers.tasks:celery_app beat -l info
    restart: unless-stopped
    mem_limit: 256m
    <<: *service-defaults
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-cs-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    mem_limit: 256m
    <<: *service-defaults
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-cs-prometheus
    env_file: .env
    # 配置文件中的 __METRICS_TOKEN__ 占位符在启动时由环境变量替换（token 不入库）
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s/__METRICS_TOKEN__/$$METRICS_TOKEN/" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    mem_limit: 512m
    <<: *service-defaults
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-cs-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 256m
    <<: *service-defaults
    depends_on:
      prometheus:
        condition: service_started

  backup:
    image: postgres:16-alpine
    container_name: ai-cs-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -U postgres -h postgres -d ai_customer_service | gzip > /backups/dump_$$(date +%F_%H%M%S).sql.gz
          find /backups -name 'dump_*.sql.gz' -mtime +7 -delete
          echo "[backup] completed at $$(date +%F_%H%M%S)"
          sleep 86400
        done
    volumes:
      - backups_data:/backups
    restart: unless-stopped
    mem_limit: 256m
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy

networks:
  appnet:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pg_data:
  redis_data:
  storage_data:
  prom_data:
  grafana_data:
  backups_data:
