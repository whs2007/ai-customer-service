# 全栈部署（08 §10）：postgres(pgvector) / redis / api / worker / frontend(nginx)
# 用法：cp .env.example .env（docker 模式 DATABASE_URL/REDIS_URL 用服务名）→ docker compose up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-cs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_customer_service
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-cs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: ai-cs-api
    env_file: .env
    environment:
      # docker 内使用服务名
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_customer_service
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      STORAGE_DIR: /app/storage
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: ai-cs-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_customer_service
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      STORAGE_DIR: /app/storage
    command: celery -A app.workers.tasks:celery_app worker -l info
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-cs-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  storage_data:

