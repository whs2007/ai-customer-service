[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-service-backend"
version = "0.1.0"
description = "AI 智能客服系统 - 后端服务（B1 基建骨架）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "redis>=5.0",
    "structlog>=24.1",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "openpyxl>=3.1",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "cryptography>=42",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "B008",  # FastAPI Depends() 默认参数为惯用法
    "UP042",  # str + Enum 是本项目存储枚举的惯用写法
    "ASYNC109",  # timeout 为字面参数名，非 trio/anyio 语义
]

[tool.ruff.lint.per-file-ignores]
# 评测种子数据为长中文文本，行宽规则不适用
"app/services/eval_seed.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unused_configs = true
ignore_missing_imports = true  # celery/openpyxl/docx/pypdf 等无 stubs 的依赖
